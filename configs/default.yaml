# Single source of truth for parameters. Sections are filled in as each phase needs them.
seed: 42

paths:
  manifest: data/corpus_manifest.yaml
  raw_dir: data/raw
  processed_dir: data/processed
  index_dir: data/index
  chunks_dir: data/chunks
  eval_questions: eval/questions.jsonl
  eval_splits: eval/splits.json
  results_dir: reports/results
  query_log: logs/queries.jsonl

ingest:
  request_delay_s: 3      # arXiv asks automated clients for at most 1 request every 3 seconds
  timeout_s: 60
  user_agent: "ml-papers-rag/0.1 (portfolio research project)"

# The exact sentence the system must answer with when the corpus lacks evidence (brief, section 1).
abstention_text: "I couldn't find sufficient evidence in the available sources."

# Evaluation set rules (see eval/README.md).
eval:
  target_size: [60, 80]
  target_mix: {factual: 0.55, comparison: 0.25, unanswerable: 0.20}
  mix_tolerance: 0.05       # warn if a type's share is off its target by more than this
  quote_min_words: 5        # shorter quotes match too many places
  quote_max_words: 50       # longer quotes risk straddling chunk boundaries
  quote_fuzzy_threshold: 90 # rapidfuzz partial_ratio (0-100) counted as "same text"
  near_duplicate_threshold: 90
  test_fraction: 0.5        # share of each question type held out as the test set

# Section-aware chunking. Sizes are counted in `unit`: "tokens" = the embedding model's own
# tokenizer (must equal embedding.model), or "words" (the original Phase 3 sizing). Every entry in
# `compare` gets its own chunk file and indexes. Chunks always include appendices.
# Hard guarantee (checked by the build): dense header + chunk + special tokens <= 512, so the
# body budget is 512 - 2 special - 32 header = 478 tokens.
# BM25 indexes the FULL header (title > full section path); the dense model gets the short one.
chunking:
  unit: tokens
  tokenizer: BAAI/bge-small-en-v1.5
  max_sequence_tokens: 512
  dense_header:
    format: "{short_title} > {section}"   # short title = before the first ":"; section = last heading
    max_tokens: 32
  compare:
    - {chunk_size: 256, overlap: 64}
    - {chunk_size: 448, overlap: 64}

bm25:
  k1: 1.5
  b: 0.75

embedding:
  model: BAAI/bge-small-en-v1.5
  batch_size: 32
  # Recommended by the model card for short queries. Phase 3 found no measurable effect on dev,
  # so it is not used; kept here for reference.
  query_instruction: "Represent this sentence for searching relevant passages: "

index:
  qdrant_path: data/index/qdrant
  embeddings_dir: data/index/embeddings

# Retrieval evaluation (answerable dev questions only; unanswerable ones have no quotes).
retrieval_eval:
  split: dev
  ks: [3, 5, 10]
  top_n: 10                   # chunks retrieved per question (= largest k)
  quote_match_threshold: 90   # same rapidfuzz score as the eval-set validator
  bootstrap_samples: 1000     # resampling questions for 95% confidence intervals
  # Word-based Phase 3 results shown as reference rows next to the token-based ones.
  reference_results:
    - phase3/bm25_size150_ov30_appx
    - phase3/dense_size150_ov30_appx

reranker:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  batch_size: 32

# Phase 4: one chunk set for every retriever, so rankings can be fused.
retrieval:
  chunk_size: 448
  overlap: 64
  rrf_k: 60                 # Reciprocal Rank Fusion constant (Cormack et al., 2009)
  candidate_depth: null     # pool size N sent to the reranker; set from the depth study

# Candidate-depth study (python -m ragpapers.evaluation.candidate_depth). The hybrid pool of size
# N is the RRF fusion of BM25 top-N and dense top-N, cut to N. Decision rule, fixed before running:
# take the smallest N whose step to the next depth gains less than `flatten_gain` hybrid Recall@N,
# capped at the largest N whose p95 rerank latency is within `latency_budget_ms`.
depth_study:
  depths: [20, 50, 100]
  flatten_gain: 0.05
  latency_budget_ms: 2000

# Free tiers only. Exact model IDs are chosen and verified in Phase 5/6.
# API keys are read from .env (see .env.example), never stored here.
llm:
  provider: groq          # generator
  model: null
  fallback_provider: ollama   # unlimited offline fallback (installed later)
  fallback_model: null

judge:
  provider: gemini        # Flash or Flash-Lite, free tier
  model: null

llm_calls:
  cache_dir: cache/llm    # one cached response per (provider, model, prompt hash)
  max_retries: 6          # on HTTP 429 / transient errors
  backoff_initial_s: 2
  backoff_max_s: 120
