# Single source of truth for parameters.
seed: 42

paths:
  manifest: data/corpus_manifest.yaml
  raw_dir: data/raw
  processed_dir: data/processed
  chunks_dir: data/chunks
  eval_questions: eval/questions.jsonl
  eval_splits: eval/splits.json
  results_dir: reports/results
  query_log: logs/queries.jsonl

ingest:
  request_delay_s: 3      # arXiv asks automated clients for at most 1 request every 3 seconds
  timeout_s: 60
  user_agent: "ml-papers-rag/0.1 (portfolio research project)"

# The exact sentence the system must answer with when the corpus lacks evidence.
abstention_text: "I couldn't find sufficient evidence in the available sources."

# Evaluation set rules (see eval/README.md).
eval:
  target_size: [60, 80]
  target_mix: {factual: 0.55, comparison: 0.25, unanswerable: 0.20}
  mix_tolerance: 0.05       # warn if a type's share is off its target by more than this
  quote_min_words: 5        # shorter quotes match too many places
  quote_max_words: 50       # longer quotes risk straddling chunk boundaries
  quote_fuzzy_threshold: 90 # rapidfuzz partial_ratio (0-100) counted as "same text"
  alternatives_max: 3       # alternative quotes per evidence item (same fact, same paper)
  near_duplicate_threshold: 90
  test_fraction: 0.5        # share of each question type held out as the test set

# Section-aware chunking, sized in tokens of the embedding model's own tokenizer (must equal
# embedding.model). Chunks include appendices.
# Hard guarantee (checked by the build): dense header + chunk + special tokens <= 512, so the
# body budget is 512 - 2 special - 32 header = 478 tokens.
# BM25 indexes the FULL header (title > full section path); the dense model gets the short one.
chunking:
  chunk_size: 448
  overlap: 64
  tokenizer: BAAI/bge-small-en-v1.5
  max_sequence_tokens: 512
  dense_header:
    format: "{short_title} > {section}"   # short title = before the first ":"; section = last heading
    max_tokens: 32

bm25:
  k1: 1.5
  b: 0.75

embedding:
  model: BAAI/bge-small-en-v1.5
  batch_size: 32

index:
  qdrant_path: data/index/qdrant
  embeddings_dir: data/index/embeddings

# Hybrid retrieval: BM25 + dense fused with Reciprocal Rank Fusion.
retrieval:
  rrf_k: 60                 # Reciprocal Rank Fusion constant (Cormack et al., 2009)
  fusion_depth: 100         # candidates each retriever contributes to RRF
  rerank_depth: 20          # M: top fused candidates the cross-encoder rescores
  use_reranker: false       # the final system answers from plain hybrid retrieval

reranker:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  batch_size: 32

# Retrieval evaluation (answerable dev questions only; unanswerable ones have no evidence).
retrieval_eval:
  split: dev
  ks: [3, 5, 10]
  top_n: 10                   # chunks retrieved per question (= largest k)
  quote_match_threshold: 90   # same rapidfuzz score as the eval-set validator
  bootstrap_samples: 1000     # resampling questions for 95% confidence intervals

# Free tiers only. API keys are read from .env (see .env.example), never stored here.
# Limits are per model (free-tier consoles, Oct 2026); the client must stay under all of them.
llm:
  provider: groq          # generator
  model: openai/gpt-oss-120b
  reasoning_effort: low   # reasoning tokens count against the quota
  temperature: 0          # reproducible answers (the cache makes re-runs identical)
  max_output_tokens: 1024 # answer + reasoning
  limits: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000}
  fallback_provider: ollama   # unlimited offline fallback (installed later)
  fallback_model: null

generation:
  context_k: 8            # top-k plain-hybrid chunks sent to the generator

# LLM-as-judge (Phase 6). Chosen by a rule fixed before any grading: Gemini 3.5 Flash-Lite was
# tested first and failed the agreement threshold against the user's 20 hand grades, so the
# predefined fallback, qwen, was kept (its agreement: reports/results/judge_validation.json).
# Same provider as the generator but a different model family; own per-model Groq budget.
judge:
  provider: groq
  model: qwen/qwen3.8-27b
  temperature: 0
  max_output_tokens: 1024 # claims JSON (+ reasoning, where the model reasons)
  json_output: true       # JSON mode: response_format json_object
  limits: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000}

llm_calls:
  cache_dir: cache/llm    # one cached response per (provider, model, prompt hash)
  max_retries: 6          # on HTTP 429 / transient errors
  backoff_initial_s: 2
  backoff_max_s: 120     # a longer requested wait means a daily quota: stop, re-run to resume
  timeout_s: 120

# Connection settings per provider. Keys are read from the named environment variables.
providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
  ollama:
    host_env: OLLAMA_HOST
    default_host: http://localhost:11434

# Generation evaluation (Phase 6). Answers and judgments are written as resumable JSONL to
# reports/results/generation/<split>/.
generation_eval:
  setups: [bm25, dense, hybrid, hybrid_rerank]   # the retrieval setups, as in the retrieval table
  chars_per_token: 3.93     # prompt-size estimate before a run (calibrated on real Groq calls)
  bootstrap_samples: 1000

# Judge validation: the user's blind grades of 20 hybrid dev answers vs the judge's.
# Poor = on ANY metric, kappa < kappa_min; if one label is > skew_share of the user's grades
# on a metric, that metric uses raw agreement >= raw_min instead. Fixed before any grading.
judge_validation:
  sample: eval/judge_sample.json
  human_grades: eval/human_grades.jsonl
  grading_sheet: eval/grading/sheet.md    # gitignored: contains corpus text
  setup: hybrid
  metrics: [faithfulness, citation_correctness, relevance, correctness]
  kappa_min: 0.6
  skew_share: 0.85
  raw_min: 0.85
