[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragpapers"
version = "0.1.0"
description = "Evaluated RAG assistant over a curated corpus of AI/ML research papers."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Direct dependencies are pinned to exact versions. New ones are added in the phase that needs them.
dependencies = [
    "pyyaml==6.0.3",
    # Phase 1: ingestion
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    # Phase 2: evaluation set (fuzzy quote matching)
    "rapidfuzz==3.14.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "pre-commit==4.6.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: style errors, F: pyflakes (unused imports, undefined names), I: import sorting,
# B: bugbear (likely bugs), UP: modern Python syntax, SIM: simplifications.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
